label.faq.shipping=FAQ:
# Enrollment Section
faq.school.enrollment.1=How do I enroll my child in the school?
faq.school.enrollment.answer1=Enrollment can be completed online via our website. Visit the 'Admissions' section, fill out the form, and submit required documents.
# Grades Section
faq.school.grades.1=How can I view my child's grades?
faq.school.grades.answer1=Log in to the electronic journal with your parent credentials. Grades are updated weekly under the 'Grades' tab.
# Login Section
faq.school.login.1=What should I do if I forget my login credentials?
faq.school.login.answer1=Click 'Forgot Password' on the login page and follow the reset instructions sent to your registered email.
# Attendance Section
faq.school.attendance.1=How are attendance records managed?
faq.school.attendance.answer1=Attendance is recorded daily by teachers and visible to parents in the 'Attendance' section of the journal.
# Support Section
faq.school.support.1=Who do I contact for technical support?
faq.school.support.answer1=Contact our IT support team at support@schooljournal.com or call +1-800-555-1234 for assistance.
