# General FAQ Label
label.faq.shipping=Frequently Asked Questions:
# Enrollment Section
faq.school.enrollment.1=How do I enroll my child in the school?
faq.school.enrollment.answer1=Enrollment can be completed online through our website. Visit the "Admissions" section, fill out the form, and submit the required documents.
# Grades Section
faq.school.grades.1=How can I view my child's grades?
faq.school.grades.answer1=Log in to the school journal with your parent credentials. Grades are updated weekly in the "Grades" tab.
# Login Section
faq.school.login.1=What should I do if I forgot my login details?
faq.school.login.answer1=Click "Forgot Password" on the login page and follow the instructions to reset your password, which will be sent to your registered email.
# Attendance Section
faq.school.attendance.1=How is attendance tracked?
faq.school.attendance.answer1=Attendance is recorded daily by teachers and is available to parents in the "Attendance" section of the journal.
# Support Section
faq.school.support.1=Who should I contact for technical support?
faq.school.support.answer1=Contact our technical support team at support@schooljournal.com or call +1-800-555-1234.
