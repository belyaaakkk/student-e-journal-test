<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Class Chat</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/messages.css}">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{class.chat(${className})}">Class Chat</div>

    <div class="container messages-container">
        <div class="messages-area">
            <div class="conversation-header">
                <h3 th:text="#{class.chat(${className})}">Class</h3>
            </div>

            <div class="messages-list">
                <div th:each="message : ${messages}" class="message"
                     th:classappend="${message.sender.id == #authentication.principal.id} ? 'sent' : 'received'">
                    <div class="message-content">
                        <strong th:text="${message.sender.firstname + ' ' + message.sender.lastname}">Sender Name</strong>
                        <p th:text="${message.content}">Message content</p>
                        <span class="timestamp" th:text="${#temporals.format(message.timestamp, 'dd MMM yyyy HH:mm')}">Date</span>
                    </div>
                </div>
            </div>

            <form class="message-form">
                <div class="input-group">
                    <textarea name="content" placeholder="Type your message..." required></textarea>
                    <button type="submit" class="btn">Send</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script th:inline="javascript">
    const className = /*[[${className}]]*/ 'default';
    const currentUsername = /*[[${#authentication.name}]]*/ 'anonymous';
    const stompClient = Stomp.over(new SockJS('/chat-websocket'));

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/class/' + className, function (message) {
            const msg = JSON.parse(message.body);
            const container = document.querySelector('.messages-list');

            const messageDiv = document.createElement('div');
            const messageClass = msg.senderUsername === currentUsername ? 'sent' : 'received';
            messageDiv.className = 'message ' + messageClass;

            messageDiv.innerHTML = `
                <div class="message-content">
                    <strong>${msg.senderName}</strong>
                    <p>${msg.content}</p>
                    <span class="timestamp">${msg.timestamp}</span>
                </div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        });
    });

    document.querySelector('.message-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const textarea = this.querySelector('textarea');
        const content = textarea.value.trim();

        if (content) {
            stompClient.send('/app/chat.sendMessage', {}, JSON.stringify({content}));
            textarea.value = '';
        }
    });
</script>

</body>
</html>
