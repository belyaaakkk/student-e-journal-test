<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learn Sidebar</title>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" type="text/css" th:href="@{/css/sidebar.css}">

</head>
<body>
<nav id="sidebar">
    <ul>
        <li>
            <span class="logo">E-Learn</span>
            <button onclick="toggleSidebar()" id="toggle-btn">

                     fill="#e8eaed">

                </svg>
            </button>
        </li>

        <!-- NAVIGATION SECTION -->
        <li class="section-header">
            <span th:text="#{section.navigation}">NAVIGATION</span>
        </li>
        <li>
            <a th:href="@{/home}">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"

                </svg>
                <span th:text="#{nav.home}">Home</span>

        </li>

        <li>
            <a th:href="@{/calendar}">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="M8 4h-.8c-1.12 0-1.68 0-2.108.218a1.999 1.999 0 0 0-.874.874C4 5.52 4 6.08 4 7.2V8m4-4h8M8 4V2m8 2h.8c1.12 0 1.68 0 2.107.218c.377.192.683.497.875.874c.218.427.218.987.218 2.105V8m-4-4V2M4 8v8.8c0 1.12 0 1.68.218 2.108a2 2 0 0 0 .874.874c.427.218.987.218 2.105.218h9.606c1.118 0 1.677 0 2.104-.218c.377-.192.683-.498.875-.874c.218-.428.218-.986.218-2.104V8M4 8h16m-4 8h.002v.002H16V16Zm-4 0h.002v.002H12V16Zm-4 0h.002v.002H8V16Zm8.002-4v.002H16V12h.002ZM12 12h.002v.002H12V12Zm-4 0h.002v.002H8V12Z"/>
                </svg>
                <span th:text="#{nav.calendar}">Calendar</span>
            </a>
        </li>
        <li>
            <a th:href="@{/grades}">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="m8 12.485l4.243 4.243l8.484-8.485M3 12.485l4.243 4.243m8.485-8.485L12.5 11.5"/>
                </svg>
                <span th:text="#{nav.grades}">Grades</span>
            </a>
        </li>
        <li>
            <a th:href="@{/schedule}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M11 17h9M8 15l-2.5 3L4 17m7-5h9M8 10l-2.5 3L4 12m7-5h9M8 5L5.5 8L4 7"/>
                </svg>
                <span th:text="#{nav.schedule}">Schedule</span>
            </a>
        </li>
        <li sec:authorize="hasAuthority('TEACHER') or hasAuthority('STUDENT') or hasAuthority('PARENT')">
            <a th:href="@{/homework}">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="M9 17h10M9 12h10M9 7h10M5.002 17v.002H5V17h.002Zm0-5v.002H5V12h.002Zm0-5v.002H5V7h.002Z"/>
                </svg>
                <span th:text="#{nav.homework}">Homework</span>
            </a>
        </li>

        <!-- COMMUNICATION SECTION -->
        <li class="section-header">
            <span th:text="#{section.communication}">COMMUNICATION</span>
        </li>
        <li sec:authorize="hasAuthority('STUDENT')">
            <a href="/messages">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="M16 8h4a1 1 0 0 1 1 1v11l-3.333-2.769a1.002 1.002 0 0 0-.64-.231H9a1 1 0 0 1-1-1v-3m8-5V5a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11l3.333-2.77c.18-.148.406-.23.64-.23H8m8-5v4a1 1 0 0 1-1 1H8"/>
                </svg>
                <span th:text="#{nav.messages}">Messages</span>
            </a>
        </li>
        <li>
            <a href="/announcements">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"

                </svg>
                <span th:text="#{nav.announcements}">Announcements</span>
            </a>
        </li>

        <!-- PEOPLE SECTION -->
        <li class="section-header">
            <span th:text="#{section.people}">PEOPLE</span>
        </li>
        <li>
            <a href="/teachers">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="M17 20c0-1.657-2.239-3-5-3s-5 1.343-5 3m14-3c0-1.23-1.234-2.287-3-2.75M3 17c0-1.23 1.234-2.287 3-2.75m12-4.014a3 3 0 1 0-4-4.472m-8 4.472a3 3 0 0 1 4-4.472M12 14a3 3 0 1 1 0-6a3 3 0 0 1 0 6Z"/>
                </svg>
                <span th:text="#{nav.teachers}">Teachers</span>
            </a>
        </li>

        <li sec:authorize="hasAuthority('TEACHER') or hasAuthority('ADMIN')">
            <a th:href="@{/students}">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="M21 20c0-1.742-1.67-3.223-4-3.773M15 20c0-2.21-2.686-4-6-4s-6 1.79-6 4m12-7a4 4 0 0 0 0-8m-6 8a4 4 0 1 1 0-8a4 4 0 0 1 0 8Z"/>
                </svg>
                <span th:text="#{nav.students}">Students</span>
            </a>
        </li>
        <li>
            <a href="/profile">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#e8eaed">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2"
                          d="M20 21c0-2.761-3.582-5-8-5s-8 2.239-8 5m8-8a5 5 0 1 1 0-10a5 5 0 0 1 0 10Z"/>
                </svg>
                <span th:text="#{nav.profile}">Profile</span>
            </a>
        </li>
    </ul>

                    <path d="M8 12a4 4 0 1 0 8 0a4 4 0 0 0-8 0Z"/>
                </g>
            </svg>
            <span th:text="#{nav.help_settings}">Help & Settings</span>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e8eaed">
                <path d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z"/>
            </svg>
        </button>
        <ul class="sub-menu">
            <div>
                <li><a th:href="@{/support}" th:text="#{nav.support}">Support</a></li>
                <li><a th:href="@{/faq}" th:text="#{nav.faq}">FAQ</a></li>
                <li><a th:href="@{/settings}" th:text="#{nav.settings}">Settings</a></li>
            </div>
        </ul>
    </div>
</nav>

<script th:src="@{/js/sidebar.js}"></script>

</body>
</html>
