<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>School Calendar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.5/main.min.js"></script>

    <style>
        .event-lesson {
            background-color: #e6f0ff !important;
            border-left: 4px solid #007bff;
            color: #000;
        }

        .event-homework {
            background-color: #fff8e1 !important;
            border-left: 4px solid #ffca28;
            color: #000;
        }

        .calendar-legend {
            margin: 10px 0;
        }

        .legend-item {
            display: inline-block;
            padding: 6px 12px;
            margin-right: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #000;
        }

        .legend-lesson {
            background-color: #e6f0ff;
            border-left: 4px solid #007bff;
        }

        .legend-homework {
            background-color: #fff8e1;
            border-left: 4px solid #ffca28;
        }

        #event-card {
            display: none;
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            background-color: #f9f9f9;
        }

        #event-card.show {
            display: block;
        }

        .no-events {
            display: none;
            margin-top: 10px;
            color: #888;
        }

        .no-events.show {
            display: block;
        }

        .event-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{label.calendar}">Calendar</div>

    <div class="container">
        <div class="calendar-legend">
            <span class="legend-item legend-lesson">Lesson</span>
            <span class="legend-item legend-homework">Homework</span>
        </div>

        <div id="calendar"></div>

        <!-- Event card for selected day -->
        <div id="event-card">
            <h3 id="card-date">Selected Date</h3>
            <div id="event-content"></div>
            <button id="close-card">Close</button>
        </div>
        <div class="no-events" id="no-events" th:text="'No events found for this day'"></div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                try {
                    const events = /*[[${events}]]*/ [];
                    const mappedEvents = events.map(event => {
                        return {
                            id: event.id,
                            title: event.title || 'Untitled Event',
                            start: event.startDate ? new Date(event.startDate).toISOString() : null,
                            end: event.endDate ? new Date(event.endDate).toISOString() : null,
                            className: 'event-' + (event.eventType ? event.eventType.toLowerCase() : 'unknown'),
                            extendedProps: {
                                description: event.description || 'No description',
                                teacher: event.teacherName || 'N/A',
                                subject: event.subjectCode || 'N/A',
                                eventType: event.eventType || 'UNKNOWN',
                                className: event.className || 'N/A',
                                room: event.room || 'N/A',
                                homeworkId: event.homeworkId || null,
                                homeworkStatus: event.homeworkStatus || 'N/A'
                            }
                        };
                    }).filter(event => event.start && event.end);

                    const calendarEl = document.getElementById('calendar');
                    const eventCard = document.getElementById('event-card');
                    const cardDate = document.getElementById('card-date');
                    const eventContent = document.getElementById('event-content');
                    const noEvents = document.getElementById('no-events');
                    const closeCard = document.getElementById('close-card');

                    const calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: 'dayGridMonth',
                        events: mappedEvents,
                        eventClick: function (info) {
                            const props = info.event.extendedProps;
                            let details = `Title: ${info.event.title}\n` +
                                `Type: ${props.eventType}\n` +
                                `Subject: ${props.subject}\n` +
                                `Teacher: ${props.teacher}\n` +
                                `Class: ${props.className}\n` +
                                `Description: ${props.description}`;
                            if (props.eventType === 'HOMEWORK') {
                                details += `\nHomework Status: ${props.homeworkStatus}`;
                            } else if (props.eventType !== 'HOMEWORK' && props.room !== 'N/A') {
                                details += `\nRoom: ${props.room}`;
                            }
                            alert(details);
                        },
                        dateClick: function (info) {
                            const clickedDate = info.dateStr;
                            eventCard.classList.remove('show');
                            noEvents.classList.remove('show');

                            const eventsOnDate = mappedEvents.filter(event => {
                                const eventDate = new Date(event.start).toISOString().split('T')[0];
                                return eventDate === clickedDate;
                            });

                            cardDate.textContent = `Events on ${new Date(clickedDate).toLocaleDateString('en-US', {
                                weekday: 'long',
                                year: 'numeric',
                                month: 'long',
                                day: 'numeric'
                            })}`;

                            if (eventsOnDate.length > 0) {
                                eventContent.innerHTML = eventsOnDate.map(event => {
                                    let content = `
                                        <div class="event-item">
                                            <p><span class="label">Title:</span> ${event.title}</p>
                                            <p><span class="label">Type:</span> ${event.extendedProps.eventType}</p>
                                            <p><span class="label">Start:</span> ${new Date(event.start).toLocaleString()}</p>
                                            <p><span class="label">End:</span> ${new Date(event.end).toLocaleString()}</p>
                                            <p><span class="label">Class:</span> ${event.extendedProps.className}</p>
                                            <p><span class="label">Subject:</span> ${event.extendedProps.subject}</p>
                                            <p><span class="label">Teacher:</span> ${event.extendedProps.teacher}</p>`;
                                    if (event.extendedProps.eventType === 'HOMEWORK') {
                                        content += `<p><span class="label">Homework Status:</span> ${event.extendedProps.homeworkStatus}</p>`;
                                    } else if (event.extendedProps.room !== 'N/A') {
                                        content += `<p><span class="label">Room:</span> ${event.extendedProps.room}</p>`;
                                    }
                                    content += `<p><span class="label">Description:</span> ${event.extendedProps.description}</p></div>`;
                                    return content;
                                }).join('');
                                eventCard.classList.add('show');
                            } else {
                                noEvents.classList.add('show');
                            }
                        }
                    });

                    calendar.render();

                    closeCard.addEventListener('click', function () {
                        eventCard.classList.remove('show');
                    });
                } catch (e) {
                    console.error('Error initializing calendar:', e);
                }
            });
        </script>
    </div>
</main>
</body>
</html>
