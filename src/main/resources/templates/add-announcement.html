<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{label.add_announcement}">Add Announcement</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{label.add_announcement}">Add Announcement</div>

    <div class="container">
        <form method="post" th:action="@{/announcements/add}" th:object="${announcement}">
            <div class="profile-row">
                <div class="input-group">
                    <label for="title" th:text="#{label.title}">Title:</label>
                    <input type="text" id="title" th:field="*{title}" required/>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <label for="type" th:text="#{label.type}">Type:</label>
                    <select id="type" th:field="*{type}" required>
                        <option th:each="type : ${announcementTypes}"
                                th:value="${type}"
                                th:text="#{${type.getDisplayName()}}"></option>
                    </select>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <label for="content" th:text="#{label.content}">Content:</label>
                    <input id="content" th:field="*{content}" required/>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <button class="btn" type="submit" th:text="#{button.save}">Save</button>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
