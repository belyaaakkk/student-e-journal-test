<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header">
        <a th:href="@{/homework}" class="back-arrow" title="Back">←</a>
        <span th:text="#{label.add_homework}">Add Homework</span>
    </div>

    <div class="container">
        <form th:action="@{/homework/add}" th:object="${homework}" method="post">
            <div class="profile-row">
                <div class="input-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" th:field="*{title}" required/>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <label for="description">Description:</label>
                    <input type="text" id="description" th:field="*{description}" required/>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <label for="endDate">End Date:</label>
                    <input type="datetime-local" id="endDate" th:field="*{dueDate}" required/>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <label for="classId">Class:</label>
                    <select id="classId" th:field="*{classCode}">
                        <option th:each="class : ${classes}"
                                th:value="${class}"
                                th:text="${class}"
                        >Subject
                        </option>
                    </select>
                </div>
            </div>
            <div class="profile-row">
                <div class="input-group">
                    <label for="subjectId">Subject:</label>
                    <select id="subjectId" th:field="*{subjectCode}">
                        <option th:each="subject : ${subjects}"
                                th:value="${subject.code}"
                                th:text="#{${subject.messageKey}}"
                        >Subject
                        </option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn" >Add Homework</button>
        </form>
    </div>
</main>

</body>
</html>
