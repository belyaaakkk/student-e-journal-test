<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{label.grades}">Grades</div>

    <div class="container">
        <form th:action="@{/grades}" method="get">
            <div class="profile-row">
                <div>
                    <label th:text="#{label.subject}">Subject</label>
                    <select name="subject">
                        <option value="" th:selected="${selectedSubject == null}">All</option>
                        <option th:each="subject : ${subjects}"
                                th:value="${subject}"
                                th:text="#{${subject}}"
                                th:selected="${subject == selectedSubject}">
                        </option>
                    </select>
                </div>
                <button class="button-filter" type="submit" th:text="#{label.filter}">Filter</button>
                <a th:href="@{/grades/add}" class="button-filter" th:text="#{label.add_grade}"
                   sec:authorize="hasAuthority('TEACHER')">
                    Add Homework
                </a>
            </div>
        </form>
        <br>
        <table>
            <thead>
            <tr>
                <th>№</th>
                <th th:text="#{label.subject}">Subject</th>
                <th th:text="#{label.teacher.name}">Teacher</th>
                <th th:text="#{label.grade.value}">Grade</th>
                <th th:text="#{label.grade.comment}">Reason</th>
                <th th:text="#{label.created.at}">Created At</th>
                <th th:text="#{label.edit}" sec:authorize="hasAuthority('ADMIN') or hasAuthority('TEACHER')">Edit</th>
                <th th:text="#{label.delete}" sec:authorize="hasAuthority('ADMIN') or hasAuthority('TEACHER')">Delete
                </th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(grades)}">
                <td colspan="5" th:text="#{label.no.grades}">No grades found</td>
            </tr>
            <tr th:each="grade, iterStat : ${grades}">
                <td th:text="${iterStat.index + 1}">1</td>
                <td th:text="#{${grade.subjectMessageKey}}">Math</td>
                <td th:text="${grade.teacher.lastname }">John Doe</td>
                <td th:text="${grade.score}">12</td>
                <td th:text="${grade.comment}">Test</td>
                <td th:text="${#temporals.format(grade.date, 'dd MMM, yyyy HH:mm')}">2025-05-01 14:00</td>
                <td sec:authorize="hasAuthority('ADMIN') or hasAuthority('TEACHER')">
                    <a class="profile-link" th:href="@{'/grades/edit/' + ${grade.id}}"
                       th:text="#{label.edit}">Edit</a>
                </td>
                <td sec:authorize="hasAuthority('ADMIN') or hasAuthority('TEACHER')">
                    <form th:action="@{'/grades/delete/' + ${grade.id}}" method="post"
                          th:onsubmit="return confirm('Are you sure you want to delete this grade?');">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="button-filter" th:text="#{label.delete}">Delete</button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <ul>
                <li th:if="${currentPage > 0}">
                    <a th:href="@{/grades(page=${currentPage - 1}, subject=${selectedSubject})}">&laquo;</a>
                </li>

                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a th:href="@{/grades(page=${i}, subject=${selectedSubject})}"
                       th:text="${i + 1}">1</a>
                </li>

                <li th:if="${currentPage < totalPages - 1}">
                    <a th:href="@{/grades(page=${currentPage + 1}, subject=${selectedSubject})}">&raquo;</a>
                </li>
            </ul>
        </div>

    </div>

</main>

</body>
</html>
