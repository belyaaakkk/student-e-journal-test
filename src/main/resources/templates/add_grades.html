<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header">
        <a th:href="@{/grades}" class="back-arrow" title="Back">←</a>
        <span th:text="#{label.add_homework}">Add Grade</span>
    </div>

    <div class="container">
        <form th:action="@{/grades/add}" th:object="${gradeForm}" method="post">

            <label>Ученик:
                <select th:field="*{studentId}" required>
                    <option th:each="s : ${students}" th:value="${s.id}"
                            th:text="${s.user.firstname + ' ' + s.user.lastname}"></option>
                </select>
            </label>

            <!-- Teacher ID скрытое поле -->
            <input type="hidden" th:field="*{teacherId}"/>

            <label>Предмет:
                <select th:field="*{subjectId}" required>
                    <option th:each="sub : ${subjects}" th:value="${sub.id}" th:text="${sub.messageKey}"></option>
                </select>
            </label>

            <label>Оценка:
                <input type="number" th:field="*{score}" min="0" max="100" required />
            </label>

            <label>Дата:
                <input type="date" th:field="*{date}" required />
            </label>

            <label>Комментарий:
                <textarea th:field="*{comment}"></textarea>
            </label>

            <button type="submit">Добавить</button>
        </form>

    </div>
</main>

</body>
</html>
