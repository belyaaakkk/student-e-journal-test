<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Головна сторінка</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>
    <br>

    <div class="profile-header" th:text="#{label.schedule}">Schedule</div>

    <div class="container">
        <div th:if="${student != null}">
            <p>Студент: <span th:text="${student.firstName} + ' ' + ${student.lastName}"></span></p>
            <p>Клас: <span th:text="${student.classCode}"></span></p>
        </div>

        <div class="schedule-navigation">
            <form th:action="@{/schedule}" method="get">
                <input type="hidden" name="weekOffset" th:value="${weekOffset - 1}"/>
                <button type="submit" class="nav-button">
                    <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>Попередній тиждень</span>
                </button>
            </form>

            <div class="week-range-wrapper">
                <span class="week-range" th:text="${weekRange}">13 травня – 19 травня</span>
            </div>

            <form th:action="@{/schedule}" method="get">
                <input type="hidden" name="weekOffset" th:value="${weekOffset + 1}"/>
                <button type="submit" class="nav-button">
                    <span>Наступний тиждень</span>
                    <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </form>
        </div>

        <div class="full-page-center">
            <table class="schedule-table">
                <thead>
                <tr>
                    <th th:text="#{label.day}">День</th>
                    <th th:text="#{label.time}">Час</th>
                    <th th:text="#{label.subject}">Предмет</th>
                    <th th:text="#{label.teacher}">Вчитель</th>
                    <th th:text="#{label.room}">Кабінет</th>
                    <th th:text="#{label.description}">Опис</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(schedules)}">
                    <td colspan="6" th:text="#{label.no.schedule}">Немає розкладу</td>
                </tr>
                <tr th:each="schedule : ${schedules}">
                    <td th:text="${#temporals.format(schedule.startTime, 'EEEE', #locale)}">Понеділок</td>
                    <td th:text="${#temporals.format(schedule.startTime, 'HH:mm')} + '–' + ${#temporals.format(schedule.endTime, 'HH:mm')}">08:00–08:45</td>
                    <td th:text="#{${schedule.subject.messageKey}}">Математика</td>
                    <td th:text="${schedule.teacher.user.firstname} + ' ' + ${schedule.teacher.user.lastname}">Ольга Коваленко</td>
                    <td th:text="${schedule.room}">Каб. 101</td>
                    <td th:text="${schedule.description}">Вивчення дробів</td>
                </tr>
                </tbody>
            </table>

        </div>
        <div class="pagination" th:if="${schedulePage.totalPages > 1}">
            <ul>
                <li th:if="${schedulePage.hasPrevious()}">
                    <a th:href="@{/schedule(
                page=${schedulePage.number - 1},
                weekOffset=${weekOffset}
            )}">←</a>
                </li>

                <li th:each="i : ${#numbers.sequence(0, schedulePage.totalPages - 1)}"
                    th:classappend="${i == schedulePage.number} ? 'active'">
                    <a th:href="@{/schedule(
                page=${i},
                weekOffset=${weekOffset}
            )}" th:text="${i + 1}">1</a>
                </li>

                <li th:if="${schedulePage.hasNext()}">
                    <a th:href="@{/schedule(
                page=${schedulePage.number + 1},
                weekOffset=${weekOffset}
            )}">→</a>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
