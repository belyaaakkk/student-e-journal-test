<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{title.faq}">FAQ - School Journal</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{label.support.page}">Support Page:</div>

    <div class="container">
        <span th:text="#{support.intro.question}">Having a problem or a question about using the Electronic Journal?</span>
        <p th:text="#{support.intro.instruction}">Fill out the form below and we’ll get back to you as soon as possible.</p>

        <form method="post" action="/support">
            <div class="input-group">
                <label for="name" th:text="#{support.label.name}">Name:</label>
                <input type="text" id="name" name="name" th:placeholder="#{support.placeholder.name}" required>
            </div>

            <div class="input-group">
                <label for="email" th:text="#{support.label.email}">Email for reply:</label>
                <input type="email" id="email" name="email" th:placeholder="#{support.placeholder.email}" required>
            </div>

            <div class="input-group">
                <label for="message" th:text="#{support.label.message}">Describe your issue or question:</label>
                <input id="message" name="message" th:placeholder="#{support.placeholder.message}" required></input>
            </div>

            <button class="btn" type="submit" th:text="#{support.button.send}" disabled>Send</button>        </form>

        <div>
            <h2 th:text="#{support.contact.title}">Or contact us directly</h2>
            <p>📧 <span th:text="#{support.contact.email}">Email: support@school-journal.dp.ua</span></p>
            <p>📞 <span th:text="#{support.contact.phone}">Phone: +380 (50) 123-45-67</span></p>
        </div>

        <span>
            <span th:text="#{support.footer.text}">Check our</span>
            <a href="/privacy-policy" th:text="#{support.footer.privacy}">Privacy Policy</a>
            <span th:text="#{support.footer.and}">and</span>
            <a href="/terms-of-use" th:text="#{support.footer.terms}">Terms of Use</a>.
        </span>
    </div>
</main>
</body>
</html>
