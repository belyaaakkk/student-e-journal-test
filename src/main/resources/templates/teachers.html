<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{label.teachers}">Teachers</div>

    <div class="container">

        <div sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{/teachers/create}" class="button-filter"
               th:text="#{label.add_teacher}">
                Add Teacher
            </a>
        </div>
        <br>


        <div class="teachers-grid">
            <div class="teacher-card" th:each="teacher : ${teachers}">
                <a th:href="@{/teachers/{id}(id=${teacher.id})}" class="teacher-card-link">
                    <img th:src="${teacher.photoUrl != null} ? @{${teacher.photoUrl}} : @{/images/default-avatar.png}"
                         alt="Teacher Photo" class="teacher-photo">
                    <div class="card-content">
                        <div class="card-info">
                            <span class="teacher-role"
                                  th:text="${teacher.subjectCode} + ' ' + 'Teacher'">Mathematics Teacher</span>
                            <h3 th:text="${teacher.firstname} + ' ' + ${teacher.lastname}">Bob Brown</h3>
                            <p class="teacher-bio" th:text="${teacher.bio} ?: #{label.defaultBio}">Experienced educator
                                with a passion for teaching mathematics.</p>
                        </div>
                        <div class="social-links">
                            <a class="social-icon" target="_blank">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                     fill="var(--text-clr)">
                                    <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
                                </svg>
                            </a>
                            <a class="social-icon" target="_blank">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                     fill="var(--text-clr)">
                                    <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-2.717 0-4.92 2.203-4.92 4.917 0 .39.045.765.127 1.124-4.09-.205-7.719-2.165-10.148-5.144-.425.722-.666 1.561-.666 2.457 0 1.695.863 3.188 2.175 4.065-.802-.026-1.555-.247-2.213-.616v.062c0 2.367 1.684 4.344 3.919 4.789-.41.111-.842.171-1.287.171-.314 0-.621-.03-.921-.086.623 1.947 2.437 3.365 4.583 3.403-1.678 1.314-3.794 2.098-6.092 2.098-.395 0-.788-.022-1.173-.066 2.179 1.397 4.768 2.212 7.548 2.212 9.057 0 14.01-7.496 14.01-13.986 0-.213-.005-.426-.014-.637.961-.695 1.797-1.562 2.457-2.549z"/>
                                </svg>
                            </a>
                            <a class="social-icon" target="_blank">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                     fill="var(--text-clr)">
                                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.326 3.608 1.301.975.975 1.24 2.242 1.301 3.608.058 1.265.069 1.645.069 4.849s-.012 3.584-.07 4.849c-.062 1.366-.326 2.633-1.301 3.608-.975.975-2.242 1.24-3.608 1.301-1.265.058-1.645.069-4.849.069s-3.584-.012-4.849-.07c-1.366-.062-2.633-.326-3.608-1.301-.975-.975-1.24-2.242-1.301-3.608-.058-1.265-.069-1.645-.069-4.849s.012-3.584.07-4.849c.062-1.366.326-2.633 1.301-3.608.975-.975 2.242-1.24 3.608-1.301 1.265-.058 1.645-.069 4.849-.069m0-2.163c-3.259 0-3.667.014-4.947.072-1.408.064-2.816.326-3.881 1.391-1.065 1.065-1.327 2.473-1.391 3.881-.058 1.28-.072 1.688-.072 4.947s.014 3.667.072 4.947c.064 1.408.326 2.816 1.391 3.881 1.065 1.065 2.473 1.327 3.881 1.391 1.28.058 1.688.072 4.947.072s3.667-.014 4.947-.072c1.408-.064 2.816-.326 3.881-1.391 1.065-1.065 1.327-2.473 1.391-3.881.058-1.28.072-1.688.072-4.947s-.014-3.667-.072-4.947c-.064-1.408-.326-2.816-1.391-3.881-1.065-1.065-2.473-1.327-3.881-1.391-1.28-.058-1.688-.072-4.947-.072zm0 5.838c-3.313 0-6 2.687-6 6s2.687 6 6 6 6-2.687 6-6-2.687-6-6-6zm0 10c-2.209 0-4-1.791-4-4s1.791-4 4-4 4 1.791 4 4-1.791 4-4 4zm4.958-10.958c-.776 0-1.406-.63-1.406-1.406s.63-1.406 1.406-1.406 1.406.63 1.406 1.406-.63 1.406-1.406 1.406z"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
