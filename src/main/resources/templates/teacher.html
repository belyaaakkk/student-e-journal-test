<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header">
        <a th:href="@{/teachers}" class="back-arrow" title="Back">←</a>
        <span th:text="#{label.teacher.info}">Teacher Information</span>
    </div>
    <div class="container">
        <div>
            <img height="500" width="500"
                 th:src="${teacher.photoUrl != null} ? @{${teacher.photoUrl}} : @{/images/default-avatar.png}"
                 alt="Teacher Photo" class="personal-photo">
        </div>
        <div class="input-group">
            <label th:text="#{label.first.name}">First Name</label>
            <input type="text" id="firstname" name="firstname" th:value="${teacher.firstname}" readonly>
        </div>
        <div class="input-group">
            <label th:text="#{label.last.name}">Last Name</label>
            <input type="text" id="lastname" name="lastname" th:value="${teacher.lastname}" readonly>
        </div>
        <div class="input-group">
            <label th:text="#{label.email}">Email</label>
            <input type="text" id="email" name="email" th:value="${teacher.email}" readonly>
        </div>
        <div class="input-group">
            <label th:text="#{label.phone}">Phone</label>
            <input type="text" id="phone" name="phone" th:value="${teacher.phoneNumber}" readonly>
        </div>
        <div class="input-group">
            <label th:text="#{label.subject}">Subject</label>
            <input type="text" id="subject" name="subject"
                   th:with="subjectKey='label.subject.' + ${teacher.subjectCode.toLowerCase()}"
                   th:value="#{${subjectKey}}"
                   readonly>
        </div>
        <div class="input-group">
            <label th:text="#{label.bio}">Bio</label>
            <input type="text" id="bio" name="bio" th:value="${teacher.bio}" readonly>
        </div>

        <a th:href="@{/teachers/{id}/edit(id=${teacher.id})}" class="button-link"
           th:text="#{label.edit}"
           sec:authorize="hasAuthority('ADMIN')">Edit</a>

        <form th:action="@{/teachers/{id}/delete(id=${teacher.id})}" method="post"
              sec:authorize="hasAuthority('ADMIN')"
              onsubmit="return confirm('Are you sure you want to delete this teacher?');">
            <input type="hidden" name="_method" value="delete"/> <!-- если используешь HiddenHttpMethodFilter -->
            <button type="submit" class="delete-btn" th:text="#{label.delete}">Delete</button>
        </form>

    </div>
</main>

</body>
</html>
