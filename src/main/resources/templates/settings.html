<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header" th:text="#{label.settings}">Settings</div>

    <div class="container">
        <!-- Language Selector -->
        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.language}">Language</label>
                <div class="language-selector">
                    <a href="?lang=ua" class="lang-link" data-lang="ua">UA</a>
                    <a href="?lang=en" class="lang-link" data-lang="en">ENG</a>
                </div>
            </div>
        </div>

        <!-- Personal Data Editing -->
        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.personal_data}">Personal Data</label>
                <p th:text="#{label.personal_data.description}">Edit your personal information, such as name, email, and
                    phone number, on the profile editing page.</p>
                <a th:href="@{/profile/edit}" class="button-link" th:text="#{label.edit_profile_data}">Edit Personal
                    Data</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
