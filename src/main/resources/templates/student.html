<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
</head>
<body>
<!-- Вставка навигационной панели -->
<div th:replace="~{/fragments/sidebar.html}"></div>

<main>
    <div th:replace="~{/fragments/header.html}"></div>

    <br>

    <div class="profile-header">
        <a th:href="@{/students}" class="back-arrow" title="Back">←</a>
        <span th:text="#{label.student.info}">Profile</span>
    </div>

    <div class="container">
        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.first.name}">First Name</label>
                <input type="text" id="firstname" name="firstname" th:value="${student.firstName}" readonly>
            </div>
            <div class="input-group">
                <label th:text="#{label.last.name}">Last Name</label>
                <input type="text" id="lastname" name="lastname" th:value="${student.lastName}" readonly>
            </div>
        </div>

        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.email}">Email</label>
                <input type="text" id="email" name="email" th:value="${student.email}" readonly>
            </div>
            <div class="input-group">
                <label th:text="#{label.phone}">Phone</label>
                <input type="text" id="phone" name="phone" th:value="${student.phoneNumber}" readonly>
            </div>
        </div>

        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.dob}">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" th:value="${student.dateOfBirth}" readonly>
            </div>
            <div class="input-group">
                <label th:text="#{label.enrollment_date}">Enrollment Date</label>
                <input type="date" id="enrollmentDate" name="enrollmentDate" th:value="${student.enrollmentDate}"
                       readonly>
            </div>
        </div>

        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.class}">Class</label>
                <input type="text" id="className" name="className" th:value="${student.classCode}" readonly>
            </div>
        </div>

        <div class="profile-row">
            <div class="input-group">
                <label th:text="#{label.bio}">Bio</label>
                <input type="text" id="bio" name="bio" th:value="${student.bio}" readonly>
            </div>
        </div>

        <a th:href="@{/students/{id}/edit(id=${student.id})}" class="button-link"
           th:text="#{label.edit}"
           sec:authorize="hasAuthority('TEACHER') or hasAuthority('ADMIN')">Edit</a>

        <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post"
              sec:authorize="hasAuthority('ADMIN') or hasAuthority('TEACHER')"
              onsubmit="return confirm('Are you sure you want to delete this student?');">
            <input type="hidden" name="_method" value="delete" />
            <button type="submit" class="delete-btn" th:text="#{label.delete}">Delete</button>
        </form>

    </div>
</main>

</body>
</html>
