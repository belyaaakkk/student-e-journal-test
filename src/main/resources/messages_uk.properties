title.terms_of_use=Умови використання
label.terms_of_use=Умови використання
terms.section.introduction=Вступ
terms.introduction.content=Ласкаво просимо до Шкільного журналу. Користуючись нашими послугами, ви погоджуєтеся з цими Умовами використання, які регулюють ваш доступ до платформи та її використання.
terms.section.accounts=Облікові записи користувачів
terms.accounts.content=Ви повинні створити обліковий запис для доступу до певних функцій. Ви несете відповідальність за збереження конфіденційності даних вашого облікового запису.
terms.section.usage=Дозволене використання
terms.usage.content=Ви погоджуєтеся не зловживати платформою, включаючи несанкціонований доступ, збір даних або публікацію невідповідного вмісту.
terms.section.termination=Припинення
terms.termination.content=Ми залишаємо за собою право призупинити або припинити дію вашого облікового запису за порушення цих умов.
terms.section.contact=Зв’яжіться з нами
terms.contact.content=З питань щодо цих Умов звертайтесь за адресою
label.privacy_policy=Політика конфіденційності
privacy.section.introduction=Вступ
privacy.introduction.content=У Шкільному журналі ми цінуємо вашу конфіденційність. Ця Політика конфіденційності описує, як ми збираємо, використовуємо та захищаємо вашу особисту інформацію.
privacy.section.data_collection=Інформація, яку ми збираємо
privacy.data_collection.content=Ми збираємо інформацію, яку ви надаєте, наприклад, ваше ім'я, електронну пошту та навчальні записи, щоб надавати наші послуги.
privacy.section.data_usage=Як ми використовуємо вашу інформацію
privacy.data_usage.content=Ваша інформація використовується для керування вашим обліковим записом, надання освітніх послуг та зв’язку з вами.
privacy.section.data_sharing=Обмін даними
privacy.data_sharing.content=Ми не передаємо вашу особисту інформацію третім сторонам, окрім випадків, передбачених законом або необхідних для надання наших послуг.
privacy.section.security=Безпека даних
privacy.security.content=Ми впроваджуємо заходи безпеки для захисту ваших даних, але жодна система не є повністю безпечною.
privacy.section.contact=Зв’яжіться з нами
privacy.contact.content=З питань, пов’язаних із конфіденційністю, звертайтесь за адресою

