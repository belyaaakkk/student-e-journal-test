# Загальний FAQ Label
label.faq.shipping=Часті запитання:
# Секція зарахування
faq.school.enrollment.1=Як записати дитину до школи?
faq.school.enrollment.answer1=Зарахування можна здійснити онлайн через наш вебсайт. Відвідайте розділ "Прийом", заповніть форму та надішліть необхідні документи.
# Секція оцінок
faq.school.grades.1=Як я можу переглянути оцінки моєї дитини?
faq.school.grades.answer1=Увійдіть до електронного журналу з батьківськими даними. Оцінки оновлюються щотижня у вкладці "Оцінки".
# Секція входу
faq.school.login.1=Що робити, якщо я забув дані для входу?
faq.school.login.answer1=Натисніть "Забули пароль" на сторінці входу та дотримуйтесь інструкцій для скидання, які будуть надіслані на вашу зареєстровану електронну пошту.
# Секція відвідуваності
faq.school.attendance.1=Як ведеться облік відвідуваності?
faq.school.attendance.answer1=Відвідуваність записується щоденно вчителями та доступна батькам у розділі "Відвідуваність" журналу.
# Секція підтримки
faq.school.support.1=До кого звертатися за технічною підтримкою?
faq.school.support.answer1=Зверніться до нашої служби технічної підтримки за адресою support@schooljournal.com або зателефонуйте за номером +1-800-555-1234.
